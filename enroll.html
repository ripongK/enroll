<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลงทะเบียนใบหน้านักเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/dist/face-api.js"></script>
<style>
  :root {
    --ink: #17324D;        /* น้ำเงินเข้ม ตัวอักษรหลัก */
    --ink-soft: #5B6B7C;
    --paper: #F6F8FA;
    --surface: #FFFFFF;
    --line: #D9E0E7;
    --jade: #1F8A70;       /* สำเร็จ */
    --saffron: #E39B2D;    /* วงแหวนถ่ายภาพ */
    --danger: #C0392B;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Anuphan", "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 17px;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 520px; margin: 0 auto; padding: 20px 18px 40px; }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 8px 0 4px; font-weight: 700; }
  h2 { font-size: 1.2rem; margin: 0 0 4px; font-weight: 700; }
  p.sub { margin: 0 0 20px; color: var(--ink-soft); }
  .hidden { display: none !important; }

  label { display: block; font-weight: 500; margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; color: inherit;
    padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 10px; background: var(--surface);
  }
  input:focus-visible, button:focus-visible, .student:focus-visible {
    outline: 3px solid var(--saffron); outline-offset: 2px;
  }
  button {
    font: inherit; font-weight: 500; cursor: pointer;
    border: none; border-radius: 10px; padding: 12px 18px;
    background: var(--ink); color: #fff;
  }
  button.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  .row > button { flex: 1; }
  .msg { margin-top: 14px; min-height: 1.6em; color: var(--ink-soft); }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--jade); }

  header.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  header.bar button { padding: 8px 12px; font-size: .9rem; }

  /* รายชื่อนักเรียน */
  .list { margin-top: 14px; border-top: 1px solid var(--line); }
  .student {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    width: 100%; text-align: left; background: none; color: inherit;
    border-radius: 0; border-bottom: 1px solid var(--line); padding: 14px 4px;
  }
  .student .name { font-weight: 500; }
  .student .meta { color: var(--ink-soft); font-size: .9rem; }
  .badge { font-size: .85rem; white-space: nowrap; padding: 3px 10px; border-radius: 999px; }
  .badge.none { background: #EEF1F4; color: var(--ink-soft); }
  .badge.done { background: #E3F3EE; color: var(--jade); }
  .badge.blocked { background: #FBEAE8; color: var(--danger); }

  /* หน้าถ่ายภาพ: วงกล้อง + วงแหวน 5 ช่วง คือจุดเด่นเดียวของหน้า */
  .stage { position: relative; width: min(82vw, 340px); aspect-ratio: 1; margin: 22px auto 8px; }
  .stage video {
    position: absolute; inset: 9%; width: 82%; height: 82%;
    object-fit: cover; border-radius: 50%; transform: scaleX(-1);
    background: #DDE3E9;
  }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .seg { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round; transition: stroke .3s; }
  .seg.filled { stroke: var(--saffron); }
  .seg.current { stroke: var(--ink); }
  .pose { text-align: center; font-size: 1.25rem; font-weight: 700; margin: 6px 0 0; }
  .hint { text-align: center; color: var(--ink-soft); margin: 2px 0 0; min-height: 1.6em; }
  .hint.good { color: var(--jade); }

  @media (prefers-reduced-motion: reduce) { .seg { transition: none; } }
</style>
</head>
<body>
<main>

  <!-- ===== หน้าเข้าสู่ระบบ ===== -->
  <section id="view-login">
    <h1>ลงทะเบียนใบหน้านักเรียน</h1>
    <p class="sub">สำหรับครูและผู้ดูแลระบบ</p>
    <label for="email">อีเมล</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">รหัสผ่าน</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row"><button id="btn-login">เข้าสู่ระบบ</button></div>
    <p id="login-msg" class="msg"></p>
  </section>

  <!-- ===== หน้ารายชื่อ ===== -->
  <section id="view-list" class="hidden">
    <header class="bar">
      <h1>เลือกนักเรียน</h1>
      <button id="btn-logout" class="secondary">ออกจากระบบ</button>
    </header>
    <label for="search">ค้นหาด้วยรหัส ชื่อ หรือห้อง</label>
    <input id="search" type="search" placeholder="เช่น 12345 หรือ ม.4/1">
    <div id="list" class="list"></div>
    <p id="list-msg" class="msg"></p>
  </section>

  <!-- ===== หน้าถ่ายภาพ ===== -->
  <section id="view-capture" class="hidden">
    <header class="bar">
      <div>
        <h2 id="cap-name"></h2>
        <div id="cap-meta" class="meta" style="color:var(--ink-soft)"></div>
      </div>
      <button id="btn-back" class="secondary">ย้อนกลับ</button>
    </header>

    <div class="stage">
      <video id="video" autoplay muted playsinline></video>
      <svg viewBox="0 0 100 100" aria-hidden="true" id="ring"></svg>
    </div>
    <p id="pose" class="pose"></p>
    <p id="hint" class="hint">กำลังเตรียมกล้อง…</p>

    <div class="row">
      <button id="btn-retake" class="secondary">ถ่ายใหม่ทั้งหมด</button>
      <button id="btn-shot" disabled>ถ่ายท่านี้</button>
    </div>
    <div class="row"><button id="btn-save" class="hidden">บันทึกใบหน้า</button></div>
    <p id="cap-msg" class="msg"></p>
  </section>

</main>

<script>
/* =========================================================
   1) ตั้งค่า — แก้ 2 บรรทัดนี้เป็นของโปรเจกต์คุณ
   ========================================================= */
const SUPABASE_URL = 'https://eicaetchvgijzxevpymy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_HTpM7R3jcowjvwUcUEFiqg_WrB-x3sy';
//const SUPABASE_ANON_KEY = 'วาง anon / publishable key ที่นี่';

/* ค่าเกณฑ์ (ปรับได้ภายหลังจากการทดสอบ) */
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1/model/';
const MIN_SCORE = 0.8;          // ความมั่นใจขั้นต่ำว่าเป็นใบหน้า
const MIN_FACE_RATIO = 0.28;    // ใบหน้าต้องกว้างอย่างน้อย 28% ของภาพ
const SAME_PERSON_MAX = 0.55;   // ทุกภาพต้องเป็นคนเดียวกับภาพแรก
const DUPLICATE_WARN = 0.40;    // ถ้าเหมือนนักเรียนคนอื่นต่ำกว่านี้ ให้เตือน

const POSES = [
  'มองตรงที่กล้อง',
  'หันหน้าไปทางซ้ายเล็กน้อย',
  'หันหน้าไปทางขวาเล็กน้อย',
  'เงยหน้าขึ้นเล็กน้อย',
  'ก้มหน้าลงเล็กน้อย'
];

/* =========================================================
   2) ตัวแปรและเครื่องมือ
   ========================================================= */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let students = [];
let current = null;        // นักเรียนที่กำลังลงทะเบียน
let samples = [];          // descriptor ที่ถ่ายได้
let stream = null;
let modelsReady = false;
let hintTimer = null;
let detecting = false;

function show(view) {
  ['view-login', 'view-list', 'view-capture'].forEach(v => $(v).classList.toggle('hidden', v !== view));
}
function setMsg(el, text, type = '') {
  el.textContent = text;
  el.className = 'msg' + (type ? ' ' + type : '');
}

/* =========================================================
   3) เข้าสู่ระบบ / ตรวจสิทธิ์ครู
   ========================================================= */
async function afterLogin() {
  const { data: isStaff, error } = await sb.rpc('is_staff');
  if (error || !isStaff) {
    await sb.auth.signOut();
    show('view-login');
    setMsg($('login-msg'), 'บัญชีนี้ไม่มีสิทธิ์ครู ติดต่อผู้ดูแลระบบให้เพิ่มในตาราง staff', 'error');
    return;
  }
  show('view-list');
  loadStudents();
}

$('btn-login').onclick = async () => {
  setMsg($('login-msg'), 'กำลังเข้าสู่ระบบ…');
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });
  if (error) return setMsg($('login-msg'), 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'error');
  setMsg($('login-msg'), '');
  afterLogin();
};

$('btn-logout').onclick = async () => { await sb.auth.signOut(); show('view-login'); };

/* =========================================================
   4) รายชื่อนักเรียน
   ========================================================= */
async function loadStudents() {
  setMsg($('list-msg'), 'กำลังโหลดรายชื่อ…');
  const { data, error } = await sb.from('student_enrollment')
    .select('*').order('grade').order('room').order('student_code');
  if (error) return setMsg($('list-msg'), 'โหลดรายชื่อไม่สำเร็จ: ' + error.message, 'error');
  students = data;
  setMsg($('list-msg'), data.length ? '' : 'ยังไม่มีนักเรียนในระบบ เพิ่มได้ที่ตาราง students');
  renderList();
}

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const rows = students.filter(s =>
    `${s.student_code} ${s.first_name} ${s.last_name} ${s.grade}/${s.room}`.toLowerCase().includes(q));
  $('list').innerHTML = '';
  rows.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'student';
    let badge;
    if (!s.consent_given) badge = '<span class="badge blocked">ยังไม่มีใบยินยอม</span>';
    else if (s.face_count > 0) badge = `<span class="badge done">ลงทะเบียนแล้ว ${s.face_count} ชุด</span>`;
    else badge = '<span class="badge none">ยังไม่ลงทะเบียน</span>';
    btn.innerHTML = `<span><span class="name">${s.prefix ?? ''}${s.first_name} ${s.last_name}</span><br>
      <span class="meta">${s.student_code} · ${s.grade}/${s.room}</span></span>${badge}`;
    btn.onclick = () => openCapture(s);
    $('list').appendChild(btn);
  });
}
$('search').oninput = renderList;

/* =========================================================
   5) หน้าถ่ายภาพ
   ========================================================= */
function drawRing() {
  const r = 46, C = 2 * Math.PI * r, part = C / POSES.length, gap = 4;
  $('ring').innerHTML = POSES.map((_, i) => {
    const cls = i < samples.length ? 'filled' : (i === samples.length ? 'current' : '');
    return `<circle class="seg ${cls}" cx="50" cy="50" r="${r}"
      stroke-dasharray="${part - gap} ${C - part + gap}" stroke-dashoffset="${-i * part}"></circle>`;
  }).join('');
}

function updateCaptureUI() {
  drawRing();
  const done = samples.length >= POSES.length;
  $('pose').textContent = done ? 'ถ่ายครบ 5 ท่าแล้ว' : `ท่าที่ ${samples.length + 1}/5: ${POSES[samples.length]}`;
  $('btn-shot').classList.toggle('hidden', done);
  $('btn-save').classList.toggle('hidden', !done);
}

async function loadModels() {
  if (modelsReady) return;
  $('hint').textContent = 'กำลังโหลดโมเดลจดจำใบหน้า (ครั้งแรกอาจใช้เวลาสักครู่)…';
  await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  modelsReady = true;
}

async function openCapture(s) {
  if (!s.consent_given) {
    alert('ยังลงทะเบียนไม่ได้ เพราะยังไม่มีบันทึกความยินยอมจากผู้ปกครองของนักเรียนคนนี้');
    return;
  }
  current = s;
  samples = [];
  $('cap-name').textContent = `${s.prefix ?? ''}${s.first_name} ${s.last_name}`;
  $('cap-meta').textContent = `${s.student_code} · ${s.grade}/${s.room}` +
    (s.face_count ? ` · มีข้อมูลเดิม ${s.face_count} ชุด` : '');
  setMsg($('cap-msg'), '');
  show('view-capture');
  updateCaptureUI();
  $('btn-shot').disabled = true;

  try {
    await loadModels();
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 640 } }, audio: false
    });
    $('video').srcObject = stream;
    await $('video').play();
    $('btn-shot').disabled = false;
    startHints();
  } catch (e) {
    $('hint').textContent = '';
    setMsg($('cap-msg'), 'เปิดกล้องไม่ได้: อนุญาตการใช้กล้องในเบราว์เซอร์ และเปิดหน้านี้ผ่าน https หรือ localhost', 'error');
  }
}

function stopCamera() {
  clearInterval(hintTimer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
}

$('btn-back').onclick = () => { stopCamera(); show('view-list'); loadStudents(); };
$('btn-retake').onclick = () => { samples = []; setMsg($('cap-msg'), ''); updateCaptureUI(); };

/* คำแนะนำสด: ตรวจทุก 0.6 วินาทีว่าเห็นใบหน้าชัดพอหรือยัง */
function startHints() {
  clearInterval(hintTimer);
  hintTimer = setInterval(async () => {
    if (detecting || samples.length >= POSES.length) return;
    detecting = true;
    const v = $('video');
    const d = await faceapi.detectSingleFace(v, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }));
    detecting = false;
    const hint = $('hint');
    if (!d) { hint.textContent = 'ยังไม่เห็นใบหน้า ให้หันหน้าเข้ากล้อง'; hint.className = 'hint'; }
    else if (d.box.width / v.videoWidth < MIN_FACE_RATIO) { hint.textContent = 'ขยับเข้าใกล้กล้องอีกนิด'; hint.className = 'hint'; }
    else { hint.textContent = 'พร้อมถ่ายแล้ว'; hint.className = 'hint good'; }
  }, 600);
}

/* ถ่ายหนึ่งท่า */
$('btn-shot').onclick = async () => {
  $('btn-shot').disabled = true;
  setMsg($('cap-msg'), 'กำลังวิเคราะห์ใบหน้า…');
  while (detecting) await new Promise(r => setTimeout(r, 50));
  detecting = true;
  const v = $('video');
  const result = await faceapi
    .detectSingleFace(v, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.5 }))
    .withFaceLandmarks()
    .withFaceDescriptor();
  detecting = false;
  $('btn-shot').disabled = false;

  if (!result) return setMsg($('cap-msg'), 'ไม่พบใบหน้า ลองใหม่ในที่ที่มีแสงสว่างพอ', 'error');
  if (result.detection.score < MIN_SCORE) return setMsg($('cap-msg'), 'ภาพไม่ชัดพอ ให้ถือกล้องนิ่ง ๆ แล้วถ่ายใหม่', 'error');
  if (result.detection.box.width / v.videoWidth < MIN_FACE_RATIO) return setMsg($('cap-msg'), 'ใบหน้าเล็กเกินไป ขยับเข้าใกล้กล้อง', 'error');

  const desc = Array.from(result.descriptor);
  if (samples.length > 0) {
    const dist = faceapi.euclideanDistance(samples[0], desc);
    if (dist > SAME_PERSON_MAX) return setMsg($('cap-msg'), 'ภาพนี้ดูไม่ใช่คนเดียวกับภาพแรก ให้ถ่ายใหม่', 'error');
  }
  samples.push(desc);
  setMsg($('cap-msg'), `ถ่ายท่าที่ ${samples.length} สำเร็จ`, 'ok');
  updateCaptureUI();
};

/* บันทึกลง Supabase */
$('btn-save').onclick = async () => {
  $('btn-save').disabled = true;
  try {
    // 1) ตรวจว่าใบหน้านี้ซ้ำกับนักเรียนคนอื่นหรือไม่ (ใช้ค่าเฉลี่ยของ 5 ภาพ)
    setMsg($('cap-msg'), 'กำลังตรวจใบหน้าซ้ำกับนักเรียนคนอื่น…');
    const mean = samples[0].map((_, i) => samples.reduce((a, s) => a + s[i], 0) / samples.length);
    const { data: similar, error: e1 } = await sb.rpc('find_similar_face', {
      p_embedding: JSON.stringify(mean),
      p_exclude_student: current.id
    });
    if (e1) throw e1;
    if (similar && similar.length && similar[0].distance < DUPLICATE_WARN) {
      const ok = confirm(`ใบหน้านี้คล้ายกับ ${similar[0].full_name} (${similar[0].student_code}) มาก\n` +
        'อาจเป็นการลงทะเบียนผิดคน ต้องการบันทึกต่อหรือไม่');
      if (!ok) { setMsg($('cap-msg'), 'ยกเลิกการบันทึกแล้ว'); return; }
    }

    // 2) ถ้ามีข้อมูลเดิม ให้ลบก่อน (ลงทะเบียนใหม่แทนที่ของเดิม)
    if (current.face_count > 0) {
      if (!confirm('นักเรียนคนนี้มีข้อมูลใบหน้าเดิมอยู่แล้ว ต้องการแทนที่ด้วยชุดใหม่หรือไม่')) {
        setMsg($('cap-msg'), 'ยกเลิกการบันทึกแล้ว'); return;
      }
      const { error: e2 } = await sb.from('face_embeddings').delete().eq('student_id', current.id);
      if (e2) throw e2;
    }

    // 3) บันทึก 5 ชุด
    setMsg($('cap-msg'), 'กำลังบันทึก…');
    const rows = samples.map(s => ({ student_id: current.id, embedding: JSON.stringify(s) }));
    const { error: e3 } = await sb.from('face_embeddings').insert(rows);
    if (e3) throw e3;

    setMsg($('cap-msg'), 'บันทึกใบหน้าเรียบร้อยแล้ว', 'ok');
    stopCamera();
    setTimeout(() => { show('view-list'); loadStudents(); }, 1200);
  } catch (err) {
    setMsg($('cap-msg'), 'บันทึกไม่สำเร็จ: ' + (err.message || err), 'error');
  } finally {
    $('btn-save').disabled = false;
  }
};

/* =========================================================
   6) เริ่มต้น: ถ้าเคยล็อกอินไว้แล้วให้เข้าหน้ารายชื่อเลย
   ========================================================= */
sb.auth.getSession().then(({ data }) => { if (data.session) afterLogin(); });
</script>
</body>
</html>
